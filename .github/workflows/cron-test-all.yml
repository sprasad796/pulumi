name: Run full language matrix of tests daily

permissions:
  contents: read
  id-token: write

on:
  schedule:
    - cron: "27 5 * * *"
  workflow_dispatch: {}

jobs:
  gosetup:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: 'auto'

    name: Set up Go
    defaults:
      run:
        shell: bash {0}
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
          go-version: '1.25.x'

  info:
    name: info
    needs: [gosetup]
    uses: ./.github/workflows/ci-info.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.ref }}
      is-snapshot: true
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    secrets: inherit

  ci:
    name: CI
    needs: [info]
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write
      # Requested by the changelog lint job; unused on scheduled runs.
      pull-requests: write
    with:
      ref: ${{ github.ref }}
      version: ${{ needs.info.outputs.version }}
      lint: true
      test-version-sets: 'all'
      integration-test-platforms: ubuntu-latest
      acceptance-test-platforms: 'macos-latest windows-latest'
      # Disable coverage in daily runs.  This is unfortunately flaky
      # on windows, and the daily cron job runs the most extensive set
      # of tests, leading to quite a bit of flakyness.  We get coverage
      # data on every merge to main, so getting it in the daily cro
      # job is not important.
      enable-coverage: false
      env:
        PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    secrets: inherit

  performance-gate:
    name: Performance Gate
    needs: [info]
    uses: ./.github/workflows/ci-performance-gate.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.ref }}
      version: ${{ needs.info.outputs.version }}
      test-version-sets: 'all'
      performance-test-platforms: ubuntu-latest
    secrets: inherit

  ci-ok:
    name: ci-ok
    needs: [ci, performance-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: CI failed
        if: ${{ needs.ci.result != 'success' }}
        run: exit 1
      - name: CI succeeded
        run: exit 0
