name: Lint

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ref:
        required: true
        description: "GitHub ref to use"
        type: string
      version-set:
        required: true
        description: "Version matrix to use"
        type: string

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Must match the `version:` field in .custom-gcl.yml.
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  golangci:
    name: Lint Go
    runs-on: ubuntu-latest
    strategy:
      matrix:
        object: ${{ inputs.version-set }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: Display the Input Params
        run: |
          echo "display paarmas"
          echo "${{ inputs.version-set }}"    
          echo "${{ inputs.ref }}"    
          echo "displayed paarmas"
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.object.go }}
          check-latest: true
          # golangci-lint-action handles all the caching for Go.
          cache: false

      # We leverage the golangci-lint action to install
      # and maintain the cache,
      # but we want to run the command ourselves.
      # The action doesn't have an install-only mode,
      # so we'll ask it to print its help output instead.
      - name: Install golangci-lint
        uses: ./.github/actions/retry
        with:
          action: golangci/golangci-lint-action@v7
          with: |
            version: ${{ env.GOLANGCI_LINT_VERSION }}
            args: --help

  tidy:
    name: Go Tidy Auto-fix
    runs-on: ubuntu-latest
    # Define the path to the child directory
    env:
      MODULE_DIR: pkg
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.version-set }}
          cache: true
          cache-dependency-path: ${{ env.MODULE_DIR }}/go.mod
      - name: Run go mod tidy
        run: | 
          cd pkg
          go mod download
          go mod tidy

      - name: Verify no changes
        run: | 
          if [ -n "$(git status --porcelain ${{ env.MODULE_DIR }}/go.mod ${{ env.MODULE_DIR}}/go.sum)" ]; then
            echo "Error: go.mod or go.sum is not tidy. Please run 'go mod tidy' locally and commit the changes."
            git diff go.mod go.sum
            exit 1
          fi

  gen:
    name: Generate Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.version-set }}
          check-latest: true
      - name: Run make gen
        run: cd sdk/go && make gen
      - name: Fail if there are changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error Running 'make gen' in sdk/go resulted in changes"
            echo "::error Please run 'make gen' in sdk/go and commit the changes"
            exit 1
          fi

  protobuf-lint:
    name: Lint Protobufs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/retry
        with:
          action: jdx/mise-action@v2
          with: |
            experimental: true
      - name: Check Protobufs
        run: make check_proto

  sdk-lint:
    name: Lint SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: Configure dependency cooldown
        uses: ./.github/actions/dependency-cooldown
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.11'
          check-latest: true
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock
      #- name: Set up Python ${{ fromJson(inputs.version-set).python }}
      - name: Set up Python 
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Set up Node ${{ inputs.version-set }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.version-set }}
          cache: npm
          cache-dependency-path: sdk/nodejs/package-lock.json
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip requests wheel urllib3 chardet
      - name: Setup git
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
      - name: Update path
        run: |
          echo "$RUNNER_TEMP/opt/pulumi/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/retry
        with:
          action: actions/checkout@v6
          with: |
            ref: ${{ inputs.ref }}
      - name: Set Go Dep path
        run: |
          echo "PULUMI_GO_DEP_ROOT=$(dirname "$(pwd)")" >> "$GITHUB_ENV"
      - name: Ensure
        run: |
          make ensure
      - name: Lint Node
        run: |
          cd sdk/nodejs && make lint
      - name: Lint Python
        run: |
          cd sdk/python && make lint

  actionlint:
    name: Lint GHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.version-set }}
          check-latest: true
      - run: |
          make lint_actions

  changelog:
    name: Lint changelog entries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Go
        uses: ./.github/actions/retry
        with:
          action: actions/setup-go@v6
          with: |
            go-version: ${{ inputs.version-set }}
            check-latest: true
          attempt_limit: 3
          attempt_delay: 5000
      - uses: ./.github/actions/retry
        with:
          action: jdx/mise-action@v2
          with: |
            experimental: true
      - run: make lint_changelog
